name: orbit-ops

services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${APP_PORT:-8787}:8787"
    volumes:
      - orbit-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      start_period: 15s
      retries: 3

volumes:
  orbit-data:
